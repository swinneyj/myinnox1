server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy /api directly to Innodigym Renhe Cloud
    location /api/ {
        proxy_pass https://power.renhesports.com/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host power.renhesports.com;
        proxy_set_header Origin https://power.renhesports.com;
        proxy_set_header Referer https://power.renhesports.com/;
    }
}
